{% extends "base.html" %}
{% block title %}Forgot Password - Tiffin Desk{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-card__mark">TD</div>
    <h1 class="auth-card__title">Forgot password?</h1>
    <p class="auth-card__sub">Enter your email and we'll send you a password reset link.</p>

    <form method="POST" action="{{ url_for('forgot_password') }}" class="form">
      <label class="field">
        <span class="field__label">Email</span>
        <input type="email" name="email" required autofocus autocomplete="email">
      </label>

      <button type="submit" class="btn btn--primary btn--block">
        Send reset link
      </button>
    </form>

    <p class="auth-card__foot">
      Remember your password?
      <a href="{{ url_for('login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
