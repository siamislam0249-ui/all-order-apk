{% extends "base.html" %}
{% block title %}Reset Password - Tiffin Desk{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-card__mark">TD</div>
    <h1 class="auth-card__title">Reset password</h1>
    <p class="auth-card__sub">Enter your new password below.</p>

    <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="form">
      <label class="field">
        <span class="field__label">New password</span>
        <input type="password" name="password" required minlength="6" autocomplete="new-password">
      </label>

      <label class="field">
        <span class="field__label">Confirm password</span>
        <input type="password" name="confirm_password" required minlength="6" autocomplete="new-password">
      </label>

      <button type="submit" class="btn btn--primary btn--block">
        Change password
      </button>
    </form>

    <p class="auth-card__foot">
      <a href="{{ url_for('login') }}">Back to login</a>
    </p>
  </div>
</div>
{% endblock %}
